name: CI (Windows)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ml-code-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and focused tests
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Typecheck affected packages
        shell: pwsh
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/client-runtime typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/desktop typecheck

      - name: Run ML Code focused tests
        run: >-
          vp test run
          apps/server/src/pets/PetCatalog.test.ts
          apps/web/src/pets.test.ts
          apps/web/src/branding.test.ts
          scripts/build-desktop-artifact.test.ts
          packages/contracts/src/employee.test.ts
          apps/web/src/employees.test.ts
