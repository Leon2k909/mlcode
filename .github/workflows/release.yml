name: Release ML Code for Windows

on:
  push:
    tags:
      - "v*.*.*-nightly.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Nightly version, for example 0.1.2-nightly.20260813.1"
        required: true
        default: "0.1.2-nightly.20260813.1"
        type: string

permissions:
  contents: write

concurrency:
  group: ml-code-windows-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows x64 alpha
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: release
        name: Resolve release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $rawVersion = $env:GITHUB_REF_NAME
          } else {
            $rawVersion = $env:INPUT_VERSION
          }

          $version = $rawVersion.Trim().TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+-nightly\.\d{8}\.\d+$') {
            throw "Version must use the nightly format, for example 0.1.2-nightly.20260813.1. Received: $rawVersion"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve Windows package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-release-packages-v2-x64-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Test legacy ML Code database upgrade
        working-directory: apps/server
        run: vp test run src/persistence/reconcileMlCodeMigrations.test.ts

      - name: Test Windows desktop profile and identity
        working-directory: apps/desktop
        run: vp test run src/app/DesktopUserData.test.ts src/app/DesktopAppIdentity.test.ts

      - name: Test Windows update installer handoff
        working-directory: apps/desktop
        run: vp test run src/updates/DesktopUpdates.test.ts -t 'shows native installer progress'

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.release.outputs.version }}"

      - name: Build ML Code installer
        env:
          T3CODE_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: Leon2k909/mlcode
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: vp run dist:desktop:win:x64

      - name: Verify updater assets
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $requiredFiles = @(
            "release/ML-Code-$version-x64.exe",
            "release/ML-Code-$version-x64.exe.blockmap",
            "release/nightly.yml"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release asset: $file"
            }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ml-code-${{ steps.release.outputs.version }}-windows-x64
          path: |
            release/ML-Code-${{ steps.release.outputs.version }}-x64.exe
            release/ML-Code-${{ steps.release.outputs.version }}-x64.exe.blockmap
            release/nightly.yml
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ML Code Alpha v${{ steps.release.outputs.version }}
          body: |
            Windows x64 alpha release of ML Code.

            Download `ML-Code-${{ steps.release.outputs.version }}-x64.exe` to install or update ML Code.
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release/ML-Code-${{ steps.release.outputs.version }}-x64.exe
            release/ML-Code-${{ steps.release.outputs.version }}-x64.exe.blockmap
            release/nightly.yml
          fail_on_unmatched_files: true
